services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salonbot}
      POSTGRES_USER: ${POSTGRES_USER:-salonbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - salonbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salonbot} -d ${POSTGRES_DB:-salonbot}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-salonbot}
      DB_USERNAME: ${POSTGRES_USER:-salonbot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      APP_DEV_TENANT_ID: ${APP_DEV_TENANT_ID:-11111111-1111-1111-1111-111111111111}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-vXX.X}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_WABA_ID: ${META_WABA_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/integrations/google/callback}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_DEV_TENANT_ID: ${APP_DEV_TENANT_ID:-11111111-1111-1111-1111-111111111111}
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  salonbot_pgdata:
