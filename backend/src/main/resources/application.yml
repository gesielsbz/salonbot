server:
  port: 8080
  forward-headers-strategy: framework
spring:
  application:
    name: salonbot-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salonbot}
    username: ${DB_USERNAME:salonbot}
    password: ${DB_PASSWORD:change-me-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
salonbot:
  tenant:
    dev-tenant-id: ${APP_DEV_TENANT_ID:11111111-1111-1111-1111-111111111111}
  integrations:
    meta:
      graph-api-version: ${META_GRAPH_API_VERSION:vXX.X}
      phone-number-id: ${META_PHONE_NUMBER_ID:}
      waba-id: ${META_WABA_ID:}
      access-token: ${META_ACCESS_TOKEN:}
      webhook-verify-token: ${META_WEBHOOK_VERIFY_TOKEN:}
      app-secret: ${META_APP_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/integrations/google/callback}
